- name:  Carbonara
  ingredienser:
    - 1 st:Gul lök, hackad
    - 2 paket:Bacon
    - 3 dl:Matlagningsgrädde
    - 2 dl:Vitt vin
    - 2 msk:Franska örter
    - 2 msk:Färsk/fryst persilja
    - 3 st:Vitlöksklyftor
    - 500 g:Spaghetti
    - 1 tsk:Alltingsmakargodarekrydda
    - chilipulver
  instruktioner:
    - Stek gula löken mjuk i en gryta (6-7)
    - Stek baconen hård i en stekpanna (6-7)
    - Koka pastavatten
    - Franska örter
    - Häll på vinet och blanda ordentligt i botten
    - Vänta tills vinet nästan är borta
    - Häll i grädden, vitlök och halva persiljan
    - Koka upp och sänk värmen till 5
    - Låt sjuda en stund
    - Diska 🥰
    - Smaka av med salt, chili, etc
    - Häll av pastan men spara vattnet
    - Häll i pastan i grytan. Rör om försiktigt
    - Häll i baconen i grytan. Rör om försiktigt
    - Strössla resten av persiljan på toppen
  bild: https://oldcutkitchen.com/wp-content/uploads/2020/04/IMG_4807-1024x682.jpg
  kategori: Varmrätt
  tags:
    - Filip
    - Lätt
    - pasta

