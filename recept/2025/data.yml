- name: Torsk i ugn med dill- och citronsås
  ingredienser:
    - 600 g:Torskfilé, tinad
    - 2 dl:Crème fraiche
    - 1 st:Buljongtärning "Fisk"
    - 1 dl:Vatten
    - 20 g:Dill
    - 1 st:Citron
    - 250 g:Broccoli, i buketter
    - salt, peppar
  instruktioner:
    - Låt fisken rinna av ordentligt
    - Sätt ugnen på 225°C
    - Lägg fisken i en ugnssäker form. Salta och peppra
    - Koka upp crème fraiche med buljongtärning och vatten i en kastrull.
    - Smaka av med salt och peppar
    - Hacka dillen och rör ner i såsen.
    - Skölj och riv yttersta skalet av citronen och rör ner. Smaka av med citronsaft
    - Häll såsen över fisken och tillaga mitt i ugnen ca 15 minuter
    - Koka broccoli mjukt några minuter i saltat vatten. Låt rinna av.
    - Servera fisken med broccoli, potatis eller ris och resten av citronen skuren i klyftor.
  bild: https://assets.icanet.se/e_sharpen:80,q_auto,dpr_1.25,w_718,h_718,c_lfill/imagevaultfiles/id_232308/cf_259/torsk_i_ugn_med_dill-_och_citronsas.jpg
  kategori: Varmrätt
  tags:
    - Fisk

- name: Frukostbullar
  ingredienser:
    - 0,25 pkt:Jäst
    - 500 ml:Vatten
    - ca 10 dl:Vetemjöl
    - Salt
  instruktioner:
    - Smula i jästen i en stor bunke
    - Häll på vattnet och rör om så att jästen löser upp sig
    - Häll i lite salt
    - Häll i lite mjöl i taget samtidigt som du rör om till en kladdig deg
    - När mjölet är i, lägg en bakduk över bunken och ställ in i kylen över natten
    - Diska 🥰
    - På morgonen, ta på ugnen på 220 grader 
    - Ta fram en plåt och lägg på ett bakplåtspapper 
    - Ta ut bunken ur kylen och ta fram två skedar
    - Klutta ut 12 högar av degen på pappret
    - Ta på salt eller annan topping
    - Ställ in plåten i ugnen i 10-12 min. Bröden ska ha lite färg
  bild: https://assets.icanet.se/e_sharpen:80,q_auto,dpr_1.25,w_718,h_718,c_lfill/imagevaultfiles/id_240441/cf_259/kallarfranska.jpg
  tags:
    - Baka
  kategori: Bakning

- name: Dragonkyckling
  ingredienser:
    - 700 g:Kycklinglårfilé
    - 1 st:Gul lök, hackad
    - 1 st:Vitlöksklyfta, hackad
    - 3 dl:Matlagningsgrädde 
    - 1 tsk:Dijonsenap
    - 1 st:Buljongtärning "kyckling"
    - 2-3 msk:Dragon
    - Salt och peppar
    - Ris
  instruktioner:
    - Koka riset
    - Dela kycklingen i mindre bitar, ca 2x2 cm
    - Hetta upp grytan med smör eller olja och stek löken
    - Lägg i kycklingen och stek. Rör om så att det inte bränns 
    - Luckra upp kycklingbuljongtärningen i varmt vatten (från kaffemaskinen tex)
    - När kycklingen är klar, häll i buljong, grädde och senap i grytan
    - Låt sjuda några minuter
    - Smaka av med salt och peppar
  bild: https://img.koket.se/wide-mega/dragonkyckling-med-ris.jpg.webp
  tags: kyckling
  kategori: Varmrätt

- name: Stekt lax med potatis
  ingredienser:
    - 800 g:Lax, tinad
    - 600 g:Potatis, skalad
    - 1 st:Citron
    - Salt och peppar
  instruktioner:
    - Koka potatisen på låg värme
    - Ta fram och torka av fisken på en skärbräda
    - Salta fisken lätt på alla sidor
    - Förbered grönsaker, gärna ärtor
    - Förbered sås
    - Duka
    - När det är ca 10 minuter kvar på potatisen, sätt på två gjutgärnspannor varmt (7-8)
    - När stekpannorna är riktigt varma, lägg i laxen med "runda" sidan nedåt
    - Se till att det är varmt så det fräser men inte ryker (7)
    - Vänd när undersidan är lagom brun
    - Stäng av värmen när undersidan är lätt brun och insidan fortfarande har lite rått kvar
    - Låt laxen steka klart på eftervärmen
    - Kläm gärna lite citronsaft på fisken om det är för varmt
    - Glöm inte potatisen!
    - Servera direkt
  bild: https://i.pinimg.com/originals/f6/84/5e/f6845e32a748beea91bb4e130f5dab81.jpg
  tags:
    - Fisk
  kategori: Varmrätt

- name: Äggmacka
  ingredienser:
    - 2 st:Rostbröd
    - Bregott
    - 2 st:Ägg
    - Kaviar
  instruktioner:
    - Lägg rostbröden i brödrosten men sätt inte på än
    - Börja steka äggen
    - När äggen kommit halvvägs, sätt på brödrosten så att bröd och ägg är klara samtidigt
    - Smöra brödet
    - Lägg på ett ägg på varje bröd
    - Garnera med kaviar
    - Mumsa i dig
