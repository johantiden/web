- name: Köttbullar
  ingredienser:
    - 1 kg:Blandfärs
    - 3 tsk:Salt
    - 2 msk:Grov senap
    - 3 tsk:Socker
    - 2 st:Ägg
    - 4 dl:Grädde
    - 1 dl:Ströbröd
    - 1.5 st:Lök
    - 1 l:Buljong
    - peppar
  instruktioner:
    - Hacka löken i så små bitar som möjligt. Prova mixer!
    - Blanda alla andra ingredienser noga i en stor bunke
    - Rulla eller spritsa bullar på en skärbräda, kanske flera
    - Sätt ugnen på 200 °C
    - Koka upp buljongen i en kastrull eller sauteuse
    - Förbered två plåtar med bakplåtspapper
    - Städa bort alla ingredienser innan du börjar
    - Lägg försiktigt i bullar i den kokande buljongen, så många som får plats utan att trängas
    - Bullarna är redo när de flyter på ytan
    - Skopa upp bullarna och lägg ut på en bakplåt, försök att få med så lite buljong som möjligt
    - Ta i nya bullar tills alla är klara
    - Bullarna kan nu antingen stekas i stekpanna eller in i ugnen till nästan bruna - vi vill steka dem lite till när vi ska äta dem
  bild: https://storage.googleapis.com/tid1-public/permalink/IMG_20260116_212042.jpg
  kategori: Varmrätt
  tags:
    - SlängIResternaOckså


- name: Frasiga pannkakor
  ingredienser:
    - 1.7 dl:Vetemjöl
    - 1 msk:Strösocker
    - 1 krm:Salt
    - 3.3 dl:Mjölk
    - 2 st:Ägg
    - 1 dl:Kolsyrat vatten
    - Smör
  instruktioner:
    - Sätt på stekpannor så de hinner bli varma (6)
    - Blanda de torra ingredienserna i en bunka, för att få bort klumpar
    - Häll i hälften av mjölken och vispa till en jämn smet, för att få bort klumpar
    - Häll i resten av mjölken och vispa
    - Vispa i äggen
    - Förbered smör, stekspade, serveringsfat (tallrik?), skopa till smeten
    - När du är redo att steka, häll försiktigt i kolsyrade vattnet, blanda försiktigt med skopan.
    - Stek direkt på medelhög värme: Lägg en klick smör i stekpannan och vänta tills det slutar låta. Hellre för lite smet än för mycket, så att kanterna blir krispiga. Hellre lite lägre värme så att vattnet hinner dunsta innan pannkakorna blir för mörka.

  bild: https://img.koket.se/standard-giant/mormors-pannkakor.png.webp
  kategori: Frukost



