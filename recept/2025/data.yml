- name: Våfflor
  ingredienser:
    - 50 g:Smör - smält
    - 1.75 dl:Mjöl
    - 1 tsk:Bakpulver
    - 1 st:Ägg
  instruktioner:
    - Smält smöret
    - Sätt på våffeljärnet så det hinner bli varmt
    - Blanda mjöl och bakpulver noga i en bunken
    - Häll i mjölken och rör om noga
    - Häll i ägg och blanda noga
