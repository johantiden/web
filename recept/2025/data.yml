  kategori: Frukost
  tags:
    - Bröd

- name: Tomatsoppa med vitlöksbröd
  ingredienser:
    - 1 st:Gul lök, finhackad
    - 2 paket:Krossade tomater
    - 2 msk:Smör
    - 2 dl:Vatten
    - 1 dl:Vispgrädde
    - 2 st:Buljongtärningar "Grönsak"
    - Vitlöksbröd, på en plåt
    - 2 msk:Färska eller frysta örter (t.ex. persilja)
    - salt, peppar

  instruktioner:
    - Sätt ugnen på 220 grader
    - Stek löken mjuk i olja - i en stor kastrull
    - Häll i vatten, krossade tomater, smör, grädde, buljontärningar
    - Lägg in bröden i ugnen
    - Koka upp och sänk sedan värmen
    - Låt puttra i 10 minuter
    - När bröden är klara, strössla på örterna över soppan
    - Stäng av värmen och servera!
  bild: https://www.recepten.se/bilder/recept/367/main/l/tomatsoppa.jpg
  kategori: Varmrätt
  tags:
    - Soppa

- name: Idas förrättssoppa
  ingredienser:
    - 2 dl:Vatten
    - 2 dl:Mjölk
    - 4 st:Salladslökar, hackade
    - 2 st:Körsbärstomater, fjärdedelar
    - 2 msk:Olja
    - 2 tsk:Chili Explosion
    - 4 st:Äggkoppar
    - peppar, salt, alltingsmakargodarekrydda
  instruktioner:
    - Koka upp vattnet i en liten kastrull
    - Häll i Salladslök
    - Låt puttra en stund på låg värme (5-6)
    - Häll i mjölken
    - Blanda försiktigt i botten hela tiden så det inte bränns
    - Krydda med salt, peppar, chili, alltingsmakargodarekrydda
    - Häll i tomatbitarna
    - Låt puttra tills tomaterna blivit lite mjuka
    - Servera direkt i varsin äggkopp!

  bild: https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse3.mm.bing.net%2Fth%3Fid%3DOIP.kD4OkKo-SKp3ZmBUTzYkkQHaE7%26pid%3DApi&f=1&ipt=3c32ebd74580d08b94895a0007c6cc9bf0297f08230e712a27124ba31cc7d416&ipo=images
  kategori: Förrätt
  tags:
